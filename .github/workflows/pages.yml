# Publishes the web version (shallow-sea/web.html with its settings panel) to GitHub Pages.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that sea.js is built from src/
        run: python3 tools/build.py --check
      - name: Assemble the site
        run: |
          mkdir -p site
          # web.html is written to be wrapped by a page shell; give it a doctype of its own here
          { echo '<!doctype html>'; cat shallow-sea/web.html; } > site/index.html
          cp shallow-sea/sea.js shallow-sea/LivelyProperties.json shallow-sea/preview.jpg site/
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
