<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>淺海</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d4a52; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #msg {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    color: #d8f3f0; font: 15px/1.6 "Microsoft JhengHei", system-ui, sans-serif; text-align: center; padding: 16px;
  }
  #stats {
    position: fixed; left: 8px; bottom: 8px; display: none; padding: 3px 6px;
    color: #fff; background: rgba(0, 0, 0, .45); font: 12px/1.4 Consolas, monospace; border-radius: 3px;
  }
</style>
</head>
<body>
<canvas id="sea"></canvas>
<div id="msg"></div>
<div id="stats"></div>
<script src="sea.js"></script>
</body>
</html>
