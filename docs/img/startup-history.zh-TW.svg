<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 330' width='1000' height='330' font-family='Segoe UI, Helvetica, Arial, sans-serif'><rect width='1000' height='330' rx='10' fill='#ffffff'/><text x='30' y='40' font-size='21' fill='#1f2933' text-anchor='start' font-weight='bold'>更新後第一次啟動（著色器快取全部失效）</text><text x='30' y='64' font-size='13' fill='#616e7c' text-anchor='start' font-weight='normal'>秒，Intel Arc 140T 筆電，Chromium + ANGLE（Direct3D 11），多次量測的平均</text><text x='30' y='122' font-size='16' fill='#1f2933' text-anchor='start' font-weight='bold'>v1.9.2</text><rect x='130' y='102' width='719.5' height='30' rx='4' fill='#e07a2e'/><text x='859.4666666666667' y='123' font-size='16' fill='#1f2933' text-anchor='start' font-weight='bold'>42.6 s</text><text x='142' y='123' font-size='14' fill='#ffffff' text-anchor='start' font-weight='normal'>一個巨大的海床著色器</text><text x='30' y='176' font-size='16' fill='#1f2933' text-anchor='start' font-weight='bold'>v1.9.3</text><rect x='130' y='156' width='101.3' height='30' rx='4' fill='#0f7fa8'/><text x='241.33333333333334' y='177' font-size='16' fill='#1f2933' text-anchor='start' font-weight='bold'>6.0 s</text><text x='311.33333333333337' y='177' font-size='14' fill='#616e7c' text-anchor='start' font-weight='normal'>海床拆成五段，所有程式同時編譯</text><text x='30' y='230' font-size='16' fill='#1f2933' text-anchor='start' font-weight='bold'>v1.11.0</text><rect x='130' y='210' width='57.4' height='30' rx='4' fill='#0f7fa8'/><text x='197.42222222222222' y='231' font-size='16' fill='#1f2933' text-anchor='start' font-weight='bold'>3.4 s</text><text x='267.4222222222222' y='231' font-size='14' fill='#616e7c' text-anchor='start' font-weight='normal'>生物著色器拆成四個程式</text><text x='30' y='284' font-size='16' fill='#1f2933' text-anchor='start' font-weight='bold'>v1.11.1</text><rect x='130' y='264' width='38.8' height='30' rx='4' fill='#0f7fa8'/><text x='178.84444444444443' y='285' font-size='16' fill='#1f2933' text-anchor='start' font-weight='bold'>2.3 s</text