<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1100 330' width='1100' height='330' font-family='Segoe UI, Helvetica, Arial, sans-serif'><rect width='1100' height='330' rx='10' fill='#ffffff'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0 L10 5 L0 10z' fill='#616e7c'/></marker></defs><text x='30' y='42' font-size='21' fill='#1f2933' text-anchor='start' font-weight='bold'>Windows 上一個 WebGL 著色器在哪裡被編譯</text><rect x='30' y='110' width='128' height='78' rx='8' fill='#e6f4f9' stroke='#0f7fa8' stroke-width='2'/><text x='94' y='142' font-size='15' fill='#1f2933' text-anchor='middle' font-weight='bold'>GLSL</text><text x='94' y='164' font-size='13' fill='#616e7c' text-anchor='middle' font-weight='normal'>（你寫的著色器）</text><path d='M160 149 L180 149' stroke='#616e7c' stroke-width='2' marker-end='url(#a)'/><rect x='182' y='110' width='128' height='78' rx='8' fill='#e6f4f9' stroke='#0f7fa8' stroke-width='2'/><text x='246' y='142' font-size='15' fill='#1f2933' text-anchor='middle' font-weight='bold'>ANGLE</text><text x='246' y='164' font-size='13' fill='#616e7c' text-anchor='middle' font-weight='normal'>翻譯</text><path d='M312 149 L332 149' stroke='#616e7c' stroke-width='2' marker-end='url(#a)'/><rect x='334' y='110' width='128' height='78' rx='8' fill='#e6f4f9' stroke='#0f7fa8' stroke-width='2'/><text x='398' y='142' font-size='15' fill='#1f2933' text-anchor='middle' font-weight='bold'>HLSL</text><path d='M464 149 L484 149' stroke='#616e7c' stroke-width='2' marker-end='url(#a)'/><rect x='486' y='110' width='128' height='78' rx='8' fill='#fdebd9' stroke='#e07a2e' stroke-width='2'/><text x='550' y='142' font-size='15' fill='#1f2933' text-anchor='middle' font-weight='bold'>FXC</text><text x='550' y='164' font-size='13' fill='#616e7c' text-anchor='middle' font-weight='normal'>（Direct3D 編譯器）</text><path d='M616 149 L636 149' stroke='#616e7c' stroke-width='2' marker-end='url(#a)'/><rect x='638' y='110' width='128' height='78' rx='8' fill='#e6f4f9' stroke='#0f7fa8' stroke-width='2'/><text x='702' y='142' font-size='15' fill='#1f2933' text-anchor='middle' font-weight='bold'>DXBC</text><text x='702' y='164' font-size='13' fill='#616e7c' text-anchor='middle' font-weight='normal'>位元碼</text><path d='M768 149 L788 149' stroke='#616e7c' stroke-width='2' marker-end='url(#a)'/><rect x='790' y='110' width='128' height='78' rx='8' fill='#fdebd9' stroke='#e07a2e' stroke-width='2'/><text x='854' y='142' font-size='15' fill='#1f2933' text-anchor='middle' font-weight='bold'>顯示卡驅動</text><text x='854' y='164' font-size='13' fill='#616e7c' text-anchor='middle' font-weight='normal'>編譯</text><path d='M920 149 L940 149' stroke='#616e7c' stroke-width='2' marker-end='url(#a)'/><rect x='942' y='110' width='128' height='78' rx='8' fill='#e6f4f9' stroke='#0f7fa8' stroke-width='2'/><text x='1006' y='142' font-size='15' fill='#1f2933' text-anchor='middle' font-weight='bold'>GPU</text><text x='1006' y='164' font-size='13' fill='#616e7c' text-anchor='middle' font-weight='normal'>機器碼</text><path d='M40 92 L40 76 L604 76 L604 92' fill='none' stroke='#0f7fa8' stroke-width='2'/><text x='44' y='68' font-size='14' fill='#0f7fa8' text-anchor='start' font-weight='normal'>瀏覽器／ANGLE 快取：以原始碼為鍵</text><path d='M648 92 L648 76 L1060 76 L1060 92' fill='none' stroke='#0f7fa8' stroke-width='2'/><text x='652' y='68' font-size='14' fill='#0f7fa8' text-anchor='start' font-weight='normal'>驅動程式快取：以 DXBC 為鍵</text><text x='550' y='214' font-size='13' fill='#e07a2e' text-anchor='middle' font-weight='normal'>大著色器很慢：花的時間比程式碼長得快很多</text><text x='854' y='236' font-size='13' fill='#e07a2e' text-anchor='middle' font-weight='normal'>在第一次繪製時才做</text><text x='30' y='284' font-size='14' fill='#616e7c' text-anchor='start' font-weight='normal'>原始碼裡加一行註解就能避開這個快取……</text><text x='30' y='308' font-size='14' fill='#616e7c' text-anchor='start' font-weight='normal'>……但要改到程式裡的一個數值才能避開這個</text></svg>
